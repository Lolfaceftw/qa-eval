[project]
name = "qa-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openai>=2.26.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "textual>=8.0.2",
    "tiktoken>=0.12.0",
    "transformers",
    "torch",
    "torchvision",
    "torchaudio",
    "numpy",
    "scikit-learn",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
    "integration: runs real WSL-backed benchmark integration tests",
]
testpaths = ["tests"]
